<!DOCTYPE html><html lang="mk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ad Creator PRO · Ad Localizer</title>
<style>*{box-sizing:border-box}body{font:16px/1.5 system-ui;margin:auto;max-width:1100px;padding:24px;color:#202626;background:#f8f8f5}button,input,select,textarea{font:inherit;padding:8px;border-radius:6px;border:1px solid #999}button{cursor:pointer;background:white}button:disabled{opacity:.45}label,small{display:block}form,.bar,.pair{display:flex;gap:12px;flex-wrap:wrap;align-items:end}.pair{align-items:start}.pair figure{margin:0;flex:1;min-width:140px}img,canvas{display:block;width:100%}#variants button{width:140px;margin:4px;overflow-wrap:anywhere;font-size:12px}#base,#drawing{max-width:480px}section{margin-top:24px}textarea{width:100%}.issue{color:#a3210e}textarea[aria-invalid=true]{border:2px solid #a3210e}[hidden]{display:none!important}</style>
<a href="/">← Ad Localizer</a><h1>Ad Creator PRO</h1>
<form id="lookup"><label>Job ID<input required id="job"></label><label>Ad Localizer API key<input id="token" required type="password" autocomplete="off"></label><button>Отвори</button></form>
<p id="status" role="status"></p><div id="variants"></div>
<section id="review" hidden><div class="pair"><figure><figcaption>Оригинал</figcaption><img id="original"></figure><figure><figcaption>Англиска реконструкција</figcaption><img id="preview"></figure></div><button id="prepare" hidden>Подготви за локализација</button><button id="refresh">Освежи пакет</button>
<div id="approval" hidden><details><summary>Чиста основа</summary><img id="base"></details><pre style="white-space:pre-wrap" id="notes"></pre><button id="approve">Ја одобрувам реконструкцијата</button></div></section>
<section id="editor" hidden><div class="bar"><label>Пазар<select id="market"></select></label><button id="translate">Преведи текст</button><button id="save" disabled>Извези PNG</button></div><div id="fields"></div><div id="drawing"></div></section>
<script type="module" src="/src/creator.mjs"></script></html>
